name: build-apk

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: GitHub repo > Settings > Secrets and variables > Actions > Variables
      ROOTFS_URL: ${{ vars.ROOTFS_URL }}
      ROOTFS_SHA256: ${{ vars.ROOTFS_SHA256 }}
      PROOT_URL: ${{ vars.PROOT_URL }}
      PROOT_LOADER_URL: ${{ vars.PROOT_LOADER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply rootfs settings from repository variables (optional)
        run: |
          esc() { printf '%s' "$1" | sed -e 's/[&|\\]/\\&/g'; }
          CFG=app/src/main/java/com/wani/terminal/Config.kt
          if [ -n "$ROOTFS_URL" ]; then
            sed -i "s|const val ROOTFS_URL = \".*\"|const val ROOTFS_URL = \"$(esc "$ROOTFS_URL")\"|" "$CFG"
          fi
          if [ -n "$ROOTFS_SHA256" ]; then
            sed -i "s|const val ROOTFS_SHA256 = \".*\"|const val ROOTFS_SHA256 = \"$(esc "$ROOTFS_SHA256")\"|" "$CFG"
          fi
          grep -E "ROOTFS_(URL|SHA256) =" "$CFG"

      - name: Fetch proot binaries if missing (optional)
        run: |
          DIR=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DIR"
          if [ ! -f "$DIR/libproot.so" ] && [ -n "$PROOT_URL" ]; then
            curl -fsSL "$PROOT_URL" -o "$DIR/libproot.so"
          fi
          if [ ! -f "$DIR/libprootloader.so" ] && [ -n "$PROOT_LOADER_URL" ]; then
            curl -fsSL "$PROOT_LOADER_URL" -o "$DIR/libprootloader.so"
          fi
          if [ ! -f "$DIR/libproot.so" ]; then
            echo "::warning::libproot.so is missing. The APK will build, but the terminal cannot start. See README."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
